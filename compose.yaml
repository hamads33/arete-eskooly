name: arete-eskooly

services:
  mysql:
    image: mysql:8.4
    container_name: greenfield-admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: school_app
      MYSQL_USER: school_app
      MYSQL_PASSWORD: greenfield-local-db
      MYSQL_ROOT_PASSWORD: greenfield-local-root
    ports:
      - "3307:3306"
    volumes:
      - greenfield_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  greenfield_mysql_data:
    external: true
    name: admin-dashboard-ui_greenfield_mysql_data
